- Loaded Launch Mass: 573 grams (98 g dry airframe + 475 g tap water)
- Core Construction: Built from two post-consumer 1.25 L PET plastic beverage bottles—one inverted bottle serving as the primary pressurized tank with an exposed blue-ring nozzle, joined with a second bottle section forming the rounded aerodynamic nose cone.

=== AERODYNAMICS, PROPULSION & SUSTAINABILITY ===

- Sustainability & Cost-Effectiveness: Built for only 35 AED by upcycling two single-use post-consumer 1.25 L PET plastic beverage bottles into a reusable flight airframe, operating purely on zero-emission compressed air and tap water.

=== NGN 110 COMPETITION & SAFETY RULES ===

=== PROJECT SCHEDULE & GANTT CHART (OCT 25 – NOV 18, 2026) ===

=== SCOPE & GUARDRAIL ===
- Rocketbot only answers questions related to Team "The Elevators'" NGN 110 Water Rocket project, specifications, 35 AED cost, 45 m competition results, physics, safety rules, sustainability, and Gantt chart schedule. Politely decline unrelated general topics.`;

  const SYSTEM_PROMPT = (kb) => `You are Rocketbot, the water rocket assistant for Team "The Elevators" (NGN 110, American University of Sharjah, Fall 2026).

Think carefully before answering. Answer ONLY the exact question the user asked, in a concise, conversational engineering tone (usually 2-4 sentences). NEVER dump or recite the whole knowledge base, and do not add facts the user did not ask about. Use plain text; **bold** is fine for a key term. Ground every answer in the knowledge base below; if the knowledge base does not cover something, say so briefly and reason from basic engineering principles without inventing team facts or numbers.

If the question is unrelated to the team's water rocket project, politely decline in one sentence and redirect to the project (design, fins, nose cone, water load, launch angle, stability, safety, cost, sustainability, schedule).

KNOWLEDGE BASE:
"""

"""`;

  /* ---------- STATE / HELPERS ---------- */
  const $ = (id) => document.getElementById(id);
  const chat = $('chat'), input = $('input'), sendBtn = $('send'), form = $('form');
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
    del: (k) => { try { localStorage.removeItem(k); } catch {} }
  };
  const getStoredKey = () => (store.get(KEY_STORE) || '').trim();
  const getKey = () => getStoredKey() || EMBEDDED_KEY;
  const getKB = () => store.get(KB_STORE) || DEFAULT_KB;
  let history = [];          // {role:'user'|'model', text}
  let busy = false;
  let lastError = '';

  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>');

  function addMsg(role, text, note) {
    const row = document.createElement('div');
    row.className = 'msg-in flex ' + (role === 'user' ? 'justify-end' : 'justify-start');
    const b = document.createElement('div');

    b.innerHTML = fmt(text) + (note ? `<div class="mt-1.5 text-[11px] text-slate-500">${esc(note)}</div>` : '');

  }

    const row = document.createElement('div');
    row.className = 'msg-in flex justify-start';
    row.innerHTML = '<div class="flex items-center gap-1 rounded-2xl rounded-bl-md border border-edge bg-panel px-4 py-3" aria-label="Thinking"><span class="dot h-1.5 w-1.5 rounded-full bg-ion"></span><span class="dot h-1.5 w-1.5 rounded-full bg-ion"></span><span class="dot h-1.5 w-1.5 rounded-full bg-ion"></span></div>';
    chat.appendChild(row); chat.scrollTop = chat.scrollHeight;
    return row;
  }
  function updatePill() {
    const on = !!getKey();
    $('pillDot').className = 'h-2 w-2 rounded-full ' + (on ? 'bg-emerald-400' : 'bg-amber-400');
    $('pillText').textContent = on ? (isGroq(getKey()) ? 'Groq online' : 'Gemini online') : 'Offline mode';
  }

  /* ---------- OFFLINE FALLBACK ---------- */
  const OFFLINE = [
    { k: /schedule|gantt|timeline|deadline|milestone|phase|task|ms project|when (is|do|did|was)|presentation|report/i, a: "Our project ran **Oct 25 to Nov 18, 2026** (21 tasks in MS Project). Phase 1 was engineering design and research, Phase 2 was building, testing, and the competition (we hit **45 m on Nov 15**), and Phase 3 was the parallel chatbot and report track. The final presentation milestone is **Wed Nov 18**." },

    { k: /angle|degree|trajectory/i, a: "We launch at about **42°-45°**, which gives the best horizontal distance once you account for drag. That's how we reached **45 m**." },
    { k: /result|achiev|how far|distance|range|record|score|\b45\b|competition/i, a: "Our rocket flew **45 meters** horizontally at the water rocket competition on Nov 15. It launched near 42°-45° with 475 mL of water." },
    { k: /mass|weigh|weight|grams?|heavy|\bdry\b|loaded/i, a: "The rocket has a **98 g dry mass**. With 475 mL of water (475 g) the loaded launch mass is **573 g**." },
    { k: /window|inspect|clear|see[- ]through|midsection|mid-body|verify/i, a: "We left the **clear PET midsection untaped** between the black nose wrap and tail wrap. It works as an inspection window so we can check the **475 mL** water level before launch." },
    { k: /nose|cone|drag/i, a: "The **rounded nose cone** is a second 1.25 L bottle section wrapped in gloss black tape. It cuts frontal pressure drag and pulls the **Center of Gravity** forward, which helps keep the rocket stable." },

    { k: /water|ratio|fill|volume|propellant|percent|%|\bml\b|\bair\b|litre|liter/i, a: "We load **475 mL of tap water**, which is **38%** of the 1.25 L tank. The other **62%** is compressed air. Only tap water and compressed air are allowed." },
    { k: /safe|goggle|ppe|perimeter|rule|danger|metal|sharp/i, a: "NGN 110 safety rules: total length under **50 cm**, **tap water + compressed air only** (no metal parts, sharp tips, or chemical additives), **safety goggles** for everyone in the launch zone, and everyone stays at least **15 ft (4.5 m)** from the electric launcher before pressurizing or firing." },
    { k: /sustain|recycl|reus|eco|environment|upcycl|green|emission/i, a: "We **upcycled two single-use PET bottles** into a reusable airframe for only 35 AED. It runs on zero-emission compressed air and tap water." },
    { k: /stabil|center of (gravity|pressure)|\bcg\b|\bcp\b|margin|tumbl/i, a: "Stability comes from keeping the **CP behind the CG**. The nose cone pulls the CG forward and the 3 swept rear fins pull the CP aft, so the rocket flies straight without tumbling." },
    { k: /thrust|newton|physics|force|exhaust|velocity|how.*(work|fly)/i, a: "Thrust follows **Newton's Third Law**: compressed air in the top 62% of the bottle pushes 475 mL of water out of the nozzle, and the rocket is pushed up. In equation form, `F = ṁ · v_e` (mass flow rate times exhaust velocity)." },
    { k: /nozzle|launcher|length|long|50\s?cm|35\s?cm|neck|size|tall|blue/i, a: "The rocket is **35 cm long**, which is 15 cm under the 50 cm limit. An inverted bottle is the pressure tank, and its **exposed blue-ring nozzle** connects to the electric launcher." },
    { k: /design|made|material|tape|bottle|build|built|rocket|construct/i, a: "Our rocket is built from **two upcycled 1.25 L PET bottles**: one inverted as the pressurized tank with an exposed blue-ring nozzle, and a second section as the rounded nose cone. Gloss black tape covers the nose and tail, with 3 swept fins on the lower tail." },
    { k: /team|elevators|who|ngn|aus|sharjah|course|class/i, a: "We're **The Elevators**, a team in NGN 110 (Introduction to Engineering & Computing) at the American University of Sharjah, Fall 2026. Our rocket reached **45 m** in the competition." }
  ];
  function offlineAnswer(q) {
    if (/^\s*(hi|hello|hey|salam|marhaba)\b/i.test(q)) return "Hi! I'm Rocketbot, the assistant for Team The Elevators' water rocket. Ask me about our design, water load, fins, launch angle, safety rules, cost, or project schedule.";
    const hit = OFFLINE.find((o) => o.k.test(q));
    if (hit) return hit.a;
    return "I can only help with Team The Elevators' water rocket project. Try asking about the design, water load, fins, launch angle, safety rules, cost, or schedule.";

  /* ---------- GEMINI ---------- */
  // fetch with an 8s timeout. Uses AbortController, but if the host sandbox cannot clone the
  // AbortSignal ("The object can not be cloned"), retries without it and times out via Promise.race.
  async function timedFetch(url, timeoutMs, init) {
    const timeoutErr = () => new Error('Timed out after ' + (timeoutMs / 1000) + ' seconds with no response.');
    let timer;
    const timeout = new Promise((_, rej) => { timer = setTimeout(() => rej(timeoutErr()), timeoutMs); });
    timeout.catch(() => {});
    try {
      const ctrl = new AbortController();
      timeout.catch(() => ctrl.abort());
      return await Promise.race([fetch(url, Object.assign({}, init, { signal: ctrl.signal })), timeout]);
    } catch (e) {
      if (e && (e.name === 'DataCloneError' || /clon/i.test(e.message || ''))) {
        return await Promise.race([fetch(url, init), timeout]);
      }
      if (e && e.name === 'AbortError') throw timeoutErr();
      throw e;
    } finally { clearTimeout(timer); }
  }

  async function callGroqOnce(model, key, contents, systemText, timeoutMs) {
    try {
      const messages = [{ role: 'system', content: systemText }].concat(
        contents.map((c) => ({ role: c.role === 'model' ? 'assistant' : 'user', content: c.parts.map((p) => p.text).join('') }))
      );
      const res = await timedFetch(GROQ_URL, timeoutMs, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model, messages, temperature: 0.4, max_tokens: 1200, reasoning_effort: 'low' })
      });
      const raw = await res.text();
      let data = null; try { data = JSON.parse(raw); } catch {}
      if (!res.ok) {
        const msg = (data && data.error && data.error.message) || raw.slice(0, 300) || res.statusText;
        throw new Error(`HTTP ${res.status} ${res.statusText}: ${msg}`);
      }
      const text = data && data.choices && data.choices[0] && data.choices[0].message && (data.choices[0].message.content || '').trim();
      if (!text) throw new Error('No text returned (empty response)');
      return text;
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('Timed out after ' + (timeoutMs / 1000) + ' seconds with no response.');
      throw e;
    }
  }

  async function callGroq(key, contents, systemText, timeoutMs = TIMEOUT_MS) {
    let lastErr;
    for (const model of GROQ_MODELS) {
      try { return await callGroqOnce(model, key, contents, systemText, timeoutMs); }
      catch (e) {
        lastErr = e;
        // only move on to the next model if this one is missing / not accessible
        if (!/HTTP (400|403|404)\b.*model/i.test(e.message)) throw e;
      }
    }
    throw lastErr;
  }

  const callLLM = (key, contents, systemText, timeoutMs) =>
    (isGroq(key) ? callGroq : callGoogle)(key, contents, systemText, timeoutMs);

  async function callGoogle(key, contents, systemText, timeoutMs = TIMEOUT_MS) {
    try {
      const res = await timedFetch(MODEL_URL, timeoutMs, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: systemText }] },
          contents,
          generationConfig: { temperature: 0.4, maxOutputTokens: 600 }
        })
      });
      const raw = await res.text();
      let data = null; try { data = JSON.parse(raw); } catch {}
      if (!res.ok) {
        const msg = (data && data.error && data.error.message) || raw.slice(0, 300) || res.statusText;
        throw new Error(`HTTP ${res.status} ${res.statusText}: ${msg}`);
      }
      const parts = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts;
      const text = parts ? parts.map((p) => p.text || '').join('').trim() : '';
      if (!text) {
        const why = (data && data.promptFeedback && data.promptFeedback.blockReason) || (data && data.candidates && data.candidates[0] && data.candidates[0].finishReason) || 'empty response';
        throw new Error('No text returned (' + why + ')');
      }
      return text;
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('Timed out after ' + (timeoutMs / 1000) + ' seconds with no response.');
      throw e;
    }
  }

  /* ---------- SEND FLOW ---------- */
  async function send(text) {
    text = text.trim();
    if (!text || busy) return;
    busy = true; sendBtn.disabled = true;
    addMsg('user', text);
    input.value = ''; autoGrow();
    const typing = addTyping();
    const key = getKey();
    let reply, note = '';
    if (key) {
      try {
        const contents = history.slice(-8).concat([{ role: 'user', text }])
          .map((m) => ({ role: m.role, parts: [{ text: m.text }] }));
        reply = await callLLM(key, contents, SYSTEM_PROMPT(getKB()));
        lastError = '';
      } catch (e) {
        lastError = e.message;
        reply = offlineAnswer(text);
        note = 'Offline answer — AI request failed.';
      }
    } else {
      reply = offlineAnswer(text);
    }
    typing.remove();
    addMsg('model', reply, note);
    history.push({ role: 'user', text }, { role: 'model', text: reply });
    busy = false; sendBtn.disabled = false;
    input.focus();
  }

  /* ---------- UI WIRING ---------- */
  function welcome() {
    chat.innerHTML = '';
    history = [];
    addMsg('model', "Hi, I'm **Rocketbot**. I can answer questions about Team The Elevators' water rocket for NGN 110. What would you like to know?");
  }
  const CHIPS = ['How far did it fly?', 'How much water do we use?', 'Why 3 fins?', 'Best launch angle?', 'Safety rules', 'What did it cost?', 'Project schedule'];
  CHIPS.forEach((c) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = c;
    b.className = 'shrink-0 rounded-full border border-edge bg-panel px-3 py-1.5 text-xs text-slate-300 hover:border-ion/60 hover:text-white';
    b.addEventListener('click', () => send(c));
    $('chips').appendChild(b);
  });

  function autoGrow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 112) + 'px'; }
  input.addEventListener('input', autoGrow);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
  form.addEventListener('submit', (e) => { e.preventDefault(); send(input.value); });
  $('reset').addEventListener('click', welcome);

  /* ---------- OWNER MODAL ---------- */
  const modal = $('modal'), mStatus = $('modalStatus');
  function showStatus(msg, kind) {
    mStatus.textContent = msg;
    mStatus.className = 'mt-3 whitespace-pre-wrap break-words rounded-lg border px-3 py-2 font-mono text-xs ' +
      (kind === 'ok' ? 'border-emerald-500/40 bg-emerald-500/10 text-emerald-300'
        : kind === 'err' ? 'border-red-500/40 bg-red-500/10 text-red-300'
        : 'border-edge bg-space text-slate-300');
  }
  function openModal() {
    $('apiKey').value = getStoredKey();
    $('kb').value = getKB();
    if (lastError) showStatus('Last chat error:\n' + lastError, 'err'); else mStatus.className = 'hidden';
    modal.classList.remove('hidden'); modal.classList.add('flex');
    $('apiKey').focus();
  }
  function closeModal() { modal.classList.add('hidden'); modal.classList.remove('flex'); }
  function persist() {
    const k = $('apiKey').value.trim();
    if (k) store.set(KEY_STORE, k); else store.del(KEY_STORE);
    const kb = $('kb').value.trim();
    if (kb && kb !== DEFAULT_KB) store.set(KB_STORE, kb); else store.del(KB_STORE);
    updatePill();
  }

  // Secret trigger: 3 taps on the badge within 1.5s, or one tap on the status pill
  let taps = 0, tapTimer = null;
  $('badge').addEventListener('click', () => {
    taps++; clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { taps = 0; }, 1500);
    if (taps >= 3) { taps = 0; openModal(); }
  });
  $('pill').addEventListener('click', openModal);
  $('closeModal').addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  $('saveBtn').addEventListener('click', () => { persist(); showStatus('Saved in this browser.', 'ok'); });
  $('clearKey').addEventListener('click', () => { $('apiKey').value = ''; store.del(KEY_STORE); updatePill(); showStatus(EMBEDDED_KEY ? 'Saved key removed. Rocketbot is using the built-in key.' : 'API key removed. Rocketbot is in offline mode.', 'ok'); });
  $('resetKb').addEventListener('click', () => { $('kb').value = DEFAULT_KB; store.del(KB_STORE); showStatus('Default knowledge base restored.', 'ok'); });
  $('testBtn').addEventListener('click', async () => {
    const k = $('apiKey').value.trim();
    if (!k) { showStatus('Paste an API key first.', 'err'); return; }
    persist();
    showStatus('Testing key…');
    try {
      const out = await callLLM(k, [{ role: 'user', parts: [{ text: 'Reply with the single word: ready' }] }], 'You are a connection test. Reply with one word.');
      lastError = '';
      showStatus('Key works (' + (isGroq(k) ? 'Groq' : 'Google Gemini') + '). Reply: ' + out, 'ok');
    } catch (e) {
      lastError = e.message;
      showStatus(e.message, 'err');
    }
  });

  updatePill();
  welcome();
})();
</script>
</body>
</html>
