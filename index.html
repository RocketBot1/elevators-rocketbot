<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rocketbot | Team "The Elevators" - NGN 110</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            space: {
              950: '#070b14',
              900: '#0d1322',
              800: '#161f35',
              700: '#23304d',
            }
          }
        }
      }
    };
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    body { background-color: #070b14; color: #f1f5f9; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #23304d; border-radius: 9999px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-enter { animation: fadeSlideUp 0.22s ease-out forwards; }
  </style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden selection:bg-sky-500/30 selection:text-sky-200">

  <!-- Header -->
  <header class="shrink-0 bg-space-900/95 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 z-20">
    <div class="max-w-3xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/20 border border-sky-400/30 shrink-0">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.59 14.37a6 6 0 01-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 006.16-12.12A14.98 14.98 0 009.631 8.41m5.96 5.96a14.926 14.926 0 01-5.841 2.58m-.119-8.54a6 6 0 00-7.381 5.84h4.8m2.581-5.84a14.927 14.927 0 00-2.58 5.84m2.699 2.7c-.103.021-.207.041-.311.06a15.09 15.09 0 01-2.448-2.448 14.9 14.9 0 01.06-.312m-2.24 2.39a4.493 4.493 0 00-1.757 4.306 4.493 4.493 0 004.306-1.758M16.5 9a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0z" />
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-base sm:text-lg tracking-tight text-white">Rocketbot</h1>
            <button id="openKeyTrigger1" type="button" class="text-[10px] font-mono uppercase tracking-wider px-2 py-0.5 rounded-full bg-sky-500/15 text-sky-300 border border-sky-500/30 active:scale-95">NGN 110</button>
          </div>
          <p class="text-xs text-slate-400">Team "The Elevators" &bull; Water Rocket Assistant</p>
        </div>
      </div>

      <!-- Status Pill & Reset Only -->
      <div class="flex items-center gap-2">
        <button id="openKeyTrigger2" type="button" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/25 text-emerald-300 text-xs font-medium active:scale-95">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="statusText">Verified Specs</span>
        </button>
        <button id="clearChatBtn" type="button" title="Reset Chat" class="p-2 rounded-lg bg-space-800 hover:bg-space-700 text-slate-300 hover:text-white border border-slate-700/70 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Chat Stream -->
  <main id="chatContainer" class="flex-1 overflow-y-auto px-4 py-5 space-y-4">
    <div id="messagesList" class="max-w-3xl mx-auto space-y-4 pb-2"></div>
  </main>

  <!-- Starter Chips & Input Bar -->
  <footer class="shrink-0 bg-space-900/95 backdrop-blur-md border-t border-slate-800/80 px-4 pt-2.5 pb-4 z-20">
    <div class="max-w-3xl mx-auto space-y-2.5">
      <div id="quickPrompts" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-0.5">
        <button type="button" data-prompt="Describe our 3D-printed water rocket design." class="chip-btn shrink-0 text-xs px-3 py-1.5 rounded-full bg-space-800 hover:bg-sky-500/20 text-slate-200 hover:text-sky-200 border border-slate-700/80 hover:border-sky-500/40 transition">
          3D-printed design
        </button>
        <button type="button" data-prompt="Why did we choose 3 swept trapezoidal fins and an ogive nose cone?" class="chip-btn shrink-0 text-xs px-3 py-1.5 rounded-full bg-space-800 hover:bg-sky-500/20 text-slate-200 hover:text-sky-200 border border-slate-700/80 hover:border-sky-500/40 transition">
          Why 3 fins &amp; ogive?
        </button>
        <button type="button" data-prompt="What are the mandatory NGN 110 safety rules?" class="chip-btn shrink-0 text-xs px-3 py-1.5 rounded-full bg-space-800 hover:bg-sky-500/20 text-slate-200 hover:text-sky-200 border border-slate-700/80 hover:border-sky-500/40 transition">
          NGN 110 safety rules
        </button>
        <button type="button" data-prompt="What is the optimal water-to-air ratio and launch angle?" class="chip-btn shrink-0 text-xs px-3 py-1.5 rounded-full bg-space-800 hover:bg-sky-500/20 text-slate-200 hover:text-sky-200 border border-slate-700/80 hover:border-sky-500/40 transition">
          Water ratio &amp; angle
        </button>
        <button type="button" data-prompt="How is our rocket sustainable?" class="chip-btn shrink-0 text-xs px-3 py-1.5 rounded-full bg-space-800 hover:bg-sky-500/20 text-slate-200 hover:text-sky-200 border border-slate-700/80 hover:border-sky-500/40 transition">
          Sustainability
        </button>
      </div>

      <form id="chatForm" class="flex items-end gap-2">
        <div class="flex-1 bg-space-800 border border-slate-700/90 focus-within:border-sky-500/70 rounded-2xl px-3.5 py-2.5 transition shadow-inner">
          <textarea
            id="userInput"
            rows="1"
            placeholder="Ask Rocketbot about Team The Elevators' rocket..."
            class="w-full bg-transparent text-sm text-white placeholder-slate-400 focus:outline-none resize-none max-h-28 leading-relaxed"
          ></textarea>
        </div>
        <button
          type="submit"
          id="sendBtn"
          class="h-11 w-11 rounded-2xl bg-sky-500 hover:bg-sky-400 active:scale-95 text-slate-950 font-semibold flex items-center justify-center shrink-0 transition shadow-lg shadow-sky-500/20 disabled:opacity-40"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
          </svg>
        </button>
      </form>
    </div>
  </footer>

  <!-- Private Owner Key Modal (Masked as password dots, saved strictly in your own browser) -->
  <div id="ownerModal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-space-900 border border-slate-700 rounded-2xl max-w-md w-full p-5 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-white">Private Gemini Live Key</h2>
        <button id="closeOwnerModal" type="button" class="text-slate-400 hover:text-white text-base px-2">✕</button>
      </div>
      <p class="text-xs text-slate-300 leading-relaxed">
        Stored locally in <strong>your browser only</strong> (never uploaded to GitHub or shared with visitors).
      </p>
      <input id="apiKeyInput" type="password" autocomplete="off" placeholder="••••••••••••••••••••" class="w-full bg-space-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500" />
      <p id="keyErrorMsg" class="hidden text-xs text-rose-400 break-words"></p>
      <div class="flex justify-end gap-2">
        <button id="clearKeyBtn" type="button" class="px-3 py-2 rounded-lg text-xs bg-space-800 text-slate-300 hover:text-white border border-slate-700">Remove</button>
        <button id="saveKeyBtn" type="button" class="px-4 py-2 rounded-lg text-xs font-semibold bg-sky-500 text-slate-950 hover:bg-sky-400">Save Privately</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const messagesList = document.getElementById('messagesList');
      const chatContainer = document.getElementById('chatContainer');
      const chatForm = document.getElementById('chatForm');
      const userInput = document.getElementById('userInput');
      const clearChatBtn = document.getElementById('clearChatBtn');
      const statusText = document.getElementById('statusText');
      const keyErrorMsg = document.getElementById('keyErrorMsg');
      const ownerModal = document.getElementById('ownerModal');
      const apiKeyInput = document.getElementById('apiKeyInput');

      function getStoredKey() {
        try { return localStorage.getItem('rb_owner_gemini_key') || ''; } catch (e) { return ''; }
      }
      function setStoredKey(val) {
        try {
          if (val) localStorage.setItem('rb_owner_gemini_key', val);
          else localStorage.removeItem('rb_owner_gemini_key');
        } catch (e) {}
      }

      let apiKey = getStoredKey();
      let chatHistory = [];

      function updateStatus(mode) {
        if (mode === 'error') {
          statusText.textContent = 'Key Error (Tap Here)';
        } else if (apiKey) {
          statusText.textContent = 'Gemini 3.8 Live';
        } else {
          statusText.textContent = 'Verified Specs';
        }
      }
      updateStatus();

      function openKeyModal() {
        apiKeyInput.value = apiKey;
        ownerModal.classList.remove('hidden');
      }

      document.getElementById('openKeyTrigger1').addEventListener('click', openKeyModal);
      document.getElementById('openKeyTrigger2').addEventListener('click', openKeyModal);

      document.getElementById('closeOwnerModal').addEventListener('click', () => ownerModal.classList.add('hidden'));
      document.getElementById('saveKeyBtn').addEventListener('click', () => {
        apiKey = apiKeyInput.value.trim();
        setStoredKey(apiKey);
        keyErrorMsg.classList.add('hidden');
        updateStatus();
        ownerModal.classList.add('hidden');
      });
      document.getElementById('clearKeyBtn').addEventListener('click', () => {
        apiKey = '';
        apiKeyInput.value = '';
        setStoredKey('');
        keyErrorMsg.classList.add('hidden');
        updateStatus();
        ownerModal.classList.add('hidden');
      });

      const SYSTEM_PROMPT = `You are Rocketbot, the smart engineering assistant for Team "The Elevators" in NGN 110 (Introduction to Engineering & Computing, American University of Sharjah, Fall 2026).

INSTRUCTIONS:
- Think carefully and answer ONLY the exact question asked in a clear, conversational, helpful tone.
- NEVER dump the entire specification sheet unless the user explicitly asks for a full overview.
- Use the verified project facts below to reason through "why" and "how" engineering questions naturally:

TEAM "THE ELEVATORS" VERIFIED SPECS:
- Airframe: Custom matte black 3D-printed aerodynamic fuselage sleeve and pointed ogive nose cone fitted snugly over a clear PET plastic beverage bottle pressure core.
- Fins: 3 swept trapezoidal fins 3D-printed directly as part of the lower cylindrical fuselage sleeve (prevents fin flutter, glue failure, and misalignment; 3 fins balance stability with lower drag and weight than 4 fins).
- Nozzle: Exposed PET bottle neck at the bottom so it mounts cleanly on the official competition electric launcher.
- Length Constraint: Strictly under 50 cm total length from nozzle to nose cone tip.
- Propellant & Physics: Compressed air + tap water only (~30–35% water volume, 65–70% air). Thrust via Newton's Third Law (F = m_dot * v_e). Optimal horizontal distance launch angle ~42°–45°.
- Stability: Ogive nose cone cuts pressure drag and moves Center of Gravity (CG) forward; 3 swept fins move Center of Pressure (CP) aft for positive static margin.
- Sustainability: Upcycles a post-consumer PET plastic bottle; reusable modular 3D-printed shell slips onto fresh bottles without destructive glue; zero chemical emissions.
- NGN 110 Safety Rules: Max 50 cm length, tap water + compressed air only, mandatory safety goggles for everyone in launch zone, minimum 15-foot (4.5 m) safety perimeter during pressurization/launch.

Guardrail: If asked about unrelated topics (movies, homework, coding, general trivia), politely decline and steer the conversation back to Team "The Elevators'" water rocket project.`;

      function getTargetedOfflineReply(rawQuery) {
        const q = rawQuery.toLowerCase().trim();

        if (/^(hi|hello|hey|yo|sup|greetings)\b/.test(q)) {
          return `Hey! I'm **Rocketbot** for **Team "The Elevators"**. Ask me anything specific about our **3D-printed ogive nose cone**, **3 swept fins**, **water-to-air ratio**, **launch angle**, or **NGN 110 safety rules**!`;
        }
        if (/(nose|cone|ogive)/.test(q)) {
          return `Our **3D-printed matte black ogive nose cone** reduces frontal aerodynamic drag by smoothly parting airflow and shifts the **Center of Gravity (CG)** forward so the rocket flies straight without tumbling.`;
        }
        if (/(fin|fins|trapezoidal|3 fin|three fin)/.test(q)) {
          return `We use **3 swept trapezoidal fins** 3D-printed directly into the lower cylindrical fuselage sleeve. Three fins give full 3-axis roll/pitch/yaw stabilization with less weight and skin-friction drag than 4 fins, while unified 3D printing eliminates fin flutter and glue failure.`;
        }
        if (/(bottle|pet|core|pressure chamber|material)/.test(q)) {
          return `The core is a **clear PET plastic beverage bottle** chosen for its high burst strength and light weight, wrapped in a custom **matte black 3D-printed sleeve** with the bottle nozzle left exposed at the base for the electric launcher.`;
        }
        if (/(length|50|size|tall|long|dimension)/.test(q)) {
          return `NGN 110 strictly caps total rocket length at **50 cm** from the bottom of the bottle nozzle to the tip of our 3D-printed ogive nose cone.`;
        }
        if (/(water|ratio|how much water|fill|percent|30%|35%)/.test(q)) {
          return `The sweet spot is filling roughly **30% to 35% (about one-third)** of the PET bottle with tap water and leaving **65%–70%** for compressed air—enough water mass for strong momentum without carrying dead weight.`;
        }
        if (/(angle|45|degree|trajectory|distance|far)/.test(q)) {
          return `For maximum horizontal distance on the field, a launch angle around **42° to 45°** gives the best balance between upward lift and forward velocity while accounting for air drag.`;
        }
        if (/(goggle|15|feet|ft|perimeter|safe|safety|rule)/.test(q)) {
          return `Mandatory **NGN 110 safety rules**:\n- Wear **approved safety goggles** in the launch zone.\n- Stay at least **15 feet (4.5 m)** back during pressurization and launch.\n- Use **tap water and compressed air only** (no metal or sharp tips) and keep total length under **50 cm**.`;
        }
        if (/(sustain|recycle|reuse|green|environment|eco|circular)/.test(q)) {
          return `Our rocket upcycles a single-use **PET plastic bottle** as its pressure vessel, and the **3D-printed nose cone and fin sleeve** slide on without permanent glue—meaning the entire aerodynamic shell is reusable across launches.`;
        }
        if (/(design|3d|print|built|build|rocket|overview|describe)/.test(q)) {
          return `Team **"The Elevators"** built a **3D-printed aerodynamic sleeve and ogive nose cone** (matte black) fitted over a **clear PET bottle** core, featuring **3 integrated swept trapezoidal fins** and an exposed nozzle for the electric launcher—all under the **50 cm** limit.`;
        }
        if (/(stabil|drag|cg|cp|center of)/.test(q)) {
          return `Stability comes from keeping the **Center of Gravity (CG)** ahead of the **Center of Pressure (CP)**: our forward **3D-printed ogive nose cone** pulls CG forward while the **3 swept rear fins** pull CP backward.`;
        }
        if (/(physic|thrust|newton|work|propulsion)/.test(q)) {
          return `It works by **Newton's Third Law**: compressed air forces dense tap water out of the nozzle at high speed, creating an equal and opposite upward thrust force ($F = \\dot{m} v_e$).`;
        }

        return `I'm **Rocketbot**, built exclusively for **Team "The Elevators'" NGN 110 Water Rocket**. Try asking a specific question about our **3D-printed nose cone**, **3 swept fins**, **water ratio**, **launch angle**, or **safety rules**!`;
      }

      async function getGeminiReply(userMessage) {
        chatHistory.push({ role: 'user', parts: [{ text: userMessage }] });
        const recentHistory = chatHistory.slice(-8);
        const models = ['gemini-3.8-flash', 'gemini-flash-latest', 'gemini-2.5-flash'];
        let lastError = 'API request failed';

        for (const model of models) {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
          const response = await fetch(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-goog-api-key': apiKey
            },
            body: JSON.stringify({
              system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
              contents: recentHistory,
              generationConfig: { temperature: 0.5, maxOutputTokens: 350 }
            })
          });

          if (response.ok) {
            const data = await response.json();
            const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) {
              chatHistory.push({ role: 'model', parts: [{ text }] });
              updateStatus();
              return text;
            }
          } else {
            const errData = await response.json().catch(() => ({}));
            lastError = errData?.error?.message || `HTTP ${response.status}`;
            if (response.status !== 404 && !/no longer available|not found|not supported/i.test(lastError)) {
              break;
            }
          }
        }

        chatHistory.pop();
        throw new Error(lastError);
      }

      function formatMarkdown(text) {
        let html = text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');

        html = html.replace(/^### (.*$)/gim, '<h3 class="text-sm font-semibold text-sky-300 mt-1 mb-1.5">$1</h3>');
        html = html.replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold text-white">$1</strong>');
        html = html.replace(/\$([^$]+)\$/g, '<code class="font-mono text-xs px-1.5 py-0.5 rounded bg-slate-800 text-sky-300">$1</code>');

        const lines = html.split('\n');
        let inList = false;
        const processed = [];

        for (const line of lines) {
          if (/^[-*] /.test(line)) {
            if (!inList) {
              processed.push('<ul class="list-disc pl-5 space-y-1 my-1 text-slate-200">');
              inList = true;
            }
            processed.push(`<li>${line.slice(2)}</li>`);
          } else {
            if (inList) {
              processed.push('</ul>');
              inList = false;
            }
            if (line.trim() === '') {
              processed.push('<div class="h-1.5"></div>');
            } else if (!line.startsWith('<h3')) {
              processed.push(`<p class="leading-relaxed">${line}</p>`);
            } else {
              processed.push(line);
            }
          }
        }
        if (inList) processed.push('</ul>');
        return processed.join('');
      }

      function appendMessage(role, content, isTyping = false) {
        const wrapper = document.createElement('div');
        wrapper.className = `msg-enter flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;

        if (role === 'user') {
          wrapper.innerHTML = `
            <div class="max-w-[85%] sm:max-w-[75%] rounded-2xl rounded-br-sm bg-sky-500 text-slate-950 font-medium px-4 py-2.5 text-sm shadow-md">
              ${content.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}
            </div>
          `;
        } else {
          wrapper.innerHTML = `
            <div class="flex items-start gap-2.5 max-w-[92%] sm:max-w-[84%]">
              <div class="w-7 h-7 rounded-lg bg-sky-500/15 border border-sky-500/30 text-sky-400 flex items-center justify-center shrink-0 mt-0.5 text-xs font-mono font-bold">
                RB
              </div>
              <div class="rounded-2xl rounded-tl-sm bg-space-900 border border-slate-800/90 px-4 py-3 text-sm text-slate-200 shadow-md">
                ${isTyping ? '<span class="text-slate-400 animate-pulse">Thinking...</span>' : formatMarkdown(content)}
              </div>
            </div>
          `;
        }

        messagesList.appendChild(wrapper);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return wrapper;
      }

      async function handleSend(text) {
        const trimmed = text.trim();
        if (!trimmed) return;

        appendMessage('user', trimmed);
        userInput.value = '';
        userInput.style.height = 'auto';

        if (apiKey) {
          const typingNode = appendMessage('bot', '', true);
          try {
            const reply = await getGeminiReply(trimmed);
            typingNode.remove();
            appendMessage('bot', reply);
            return;
          } catch (err) {
            typingNode.remove();
            updateStatus('error');
            keyErrorMsg.textContent = `API Error: ${err.message}`;
            keyErrorMsg.classList.remove('hidden');
          }
        }

        setTimeout(() => {
          const reply = getTargetedOfflineReply(trimmed);
          appendMessage('bot', reply);
        }, 140);
      }

      chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        handleSend(userInput.value);
      });

      userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend(userInput.value);
        }
      });

      userInput.addEventListener('input', () => {
        userInput.style.height = 'auto';
        userInput.style.height = Math.min(userInput.scrollHeight, 112) + 'px';
      });

      document.querySelectorAll('.chip-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          handleSend(btn.getAttribute('data-prompt'));
        });
      });

      const WELCOME = `Welcome! I'm **Rocketbot** for **Team "The Elevators"** (NGN 110). Ask me a specific question about our **3D-printed ogive nose cone**, **3 swept fins**, **launch physics**, or **safety rules**!`;

      clearChatBtn.addEventListener('click', () => {
        messagesList.innerHTML = '';
        chatHistory = [];
        appendMessage('bot', WELCOME);
      });

      appendMessage('bot', WELCOME);
    })();
  </script>
</body>
</html>
